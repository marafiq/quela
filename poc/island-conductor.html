<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Island Conductor POC — Signals + Syncfusion</title>
    <!-- Syncfusion EJ2: single bundle for all styles + script -->
    <link href="https://cdn.syncfusion.com/ej2/material.css" rel="stylesheet">
    <script src="https://cdn.syncfusion.com/ej2/dist/ej2.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .region-hidden { display: none; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 4px; min-height: 16px; }
        h1 { font-size: 20px; }
        h2 { font-size: 16px; color: #666; margin-top: 32px; }
        #trace { background: #1e1e1e; color: #0f0; font-family: monospace; font-size: 11px; padding: 12px; max-height: 300px; overflow-y: auto; margin-top: 24px; border-radius: 4px; }
        #trace div { padding: 1px 0; }
        #payload-output { background: #f5f5f5; padding: 12px; font-family: monospace; font-size: 12px; white-space: pre; border-radius: 4px; margin-top: 8px; min-height: 20px; }
        .btn-row { margin-top: 16px; display: flex; gap: 8px; }
    </style>
</head>
<body>

<h1>Island Conductor POC</h1>
<p><code>@preact/signals-core</code> → Plan JSON → Syncfusion EJ2 controls</p>

<div class="field">
    <label>Facility</label>
    <input id="ej_FacilityId" type="text" />
    <div id="error_FacilityId" class="error"></div>
</div>

<div class="field">
    <label>Unit</label>
    <input id="ej_UnitId" type="text" />
</div>

<div class="field">
    <label>Payer Type</label>
    <input id="ej_PayerType" type="text" />
</div>

<div id="region_MedicaidSection" data-region="MedicaidSection" class="region-hidden">
    <div class="field">
        <label>Medicaid Number</label>
        <input id="ej_MedicaidNumber" type="text" />
        <div id="error_MedicaidNumber" class="error"></div>
    </div>
</div>

<div class="btn-row">
    <button id="btnValidate" class="e-btn e-primary">Validate</button>
    <button id="btnCollect" class="e-btn">Collect Payload</button>
</div>
<div id="payload-output"></div>

<h2>Trace Log</h2>
<div id="trace"></div>

<script type="application/json" id="plan">
{
    "islandId": "residentForm",
    "fields": {
        "FacilityId":     { "domId": "ej_FacilityId",     "control": "DropDownList" },
        "UnitId":         { "domId": "ej_UnitId",         "control": "DropDownList" },
        "PayerType":      { "domId": "ej_PayerType",      "control": "DropDownList" },
        "MedicaidNumber": { "domId": "ej_MedicaidNumber", "control": "TextBox" }
    },
    "regions": {
        "MedicaidSection": {
            "domId": "region_MedicaidSection",
            "visibleWhen": { "field": "PayerType", "equals": "Medicaid" },
            "fields": ["MedicaidNumber"]
        }
    },
    "rules": [
        {
            "id": "cascade_units",
            "trigger": { "type": "change", "field": "FacilityId" },
            "effects": [
                { "type": "clearField", "target": "UnitId" },
                { "type": "disableField", "target": "UnitId" },
                { "type": "loadDataSource", "target": "UnitId", "lane": "cascade_units" }
            ]
        }
    ],
    "validation": {
        "FacilityId":     [{ "type": "notEmpty", "message": "Facility is required" }],
        "MedicaidNumber": [{ "type": "notEmpty", "message": "Medicaid # is required", "when": "MedicaidSection" }]
    }
}
</script>

<script>

// ═══ ISLAND CONDUCTOR RUNTIME ═══

var traceEl = document.getElementById('trace');
function trace(msg) {
    var d = document.createElement('div');
    d.textContent = '[' + new Date().toISOString().substr(11,12) + '] ' + msg;
    traceEl.appendChild(d);
    traceEl.scrollTop = traceEl.scrollHeight;
    console.log('[IC]', msg);
}

// Fake server data for cascade demo
var FAKE_UNITS = {
    'F1': [{ text: 'Unit 101', value: 'U101' }, { text: 'Unit 102', value: 'U102' }],
    'F2': [{ text: 'Unit 201', value: 'U201' }, { text: 'Unit 202', value: 'U202' }, { text: 'Unit 203', value: 'U203' }],
    'F3': [{ text: 'Unit 301', value: 'U301' }],
};

function mountIsland(plan) {
    var fields = {};
    var controls = {};
    var regions = {};
    var disposers = [];
    var abortMap = {};

    trace('window.ej = ' + typeof window.ej);
    trace('window.ej.dropdowns = ' + typeof (window.ej && window.ej.dropdowns));
    trace('window.ej.inputs = ' + typeof (window.ej && window.ej.inputs));

    // ── Step 1: Create signals ──
    for (var name in plan.fields) {
        fields[name] = signal(null);
        trace('signal: ' + name);
    }

    // ── Step 2: Init Syncfusion + bidirectional binding ──
    for (var name in plan.fields) {
        var def = plan.fields[name];
        var el = document.getElementById(def.domId);
        if (!el) { trace('ERROR: #' + def.domId + ' not found'); continue; }

        if (def.control === 'DropDownList') {
            (function(fieldName) {
                var ddl = new ej.dropdowns.DropDownList({
                    placeholder: 'Select ' + fieldName + '...',
                    change: function(e) {
                        trace('EJ2→signal: ' + fieldName + ' = ' + JSON.stringify(e.value));
                        fields[fieldName].value = e.value;
                    }
                });
                ddl.appendTo(el);
                controls[fieldName] = ddl;
                trace('EJ2 DropDownList: #' + def.domId);
            })(name);

        } else if (def.control === 'TextBox') {
            (function(fieldName) {
                var tb = new ej.inputs.TextBox({
                    placeholder: 'Enter ' + fieldName + '...',
                    input: function(e) {
                        fields[fieldName].value = e.value;
                    }
                });
                tb.appendTo(el);
                controls[fieldName] = tb;
                trace('EJ2 TextBox: #' + def.domId);
            })(name);
        }
    }

    // ── Step 3: Seed data ──
    controls['FacilityId'].dataSource = [
        { text: 'Sunrise Manor', value: 'F1' },
        { text: 'Oak Park',      value: 'F2' },
        { text: 'Riverside',     value: 'F3' },
    ];
    controls['FacilityId'].fields = { text: 'text', value: 'value' };
    controls['FacilityId'].dataBind();

    controls['PayerType'].dataSource = [
        { text: 'Private',  value: 'Private' },
        { text: 'Medicaid', value: 'Medicaid' },
        { text: 'Medicare', value: 'Medicare' },
    ];
    controls['PayerType'].fields = { text: 'text', value: 'value' };
    controls['PayerType'].dataBind();

    controls['UnitId'].fields = { text: 'text', value: 'value' };
    controls['UnitId'].enabled = false;

    // ── Step 4: Regions ──
    for (var regionName in plan.regions) {
        (function(rName, rDef) {
            var depField = fields[rDef.visibleWhen.field];
            var targetValue = rDef.visibleWhen.equals;

            regions[rName] = computed(function() {
                return depField.value === targetValue;
            });

            disposers.push(effect(function() {
                var visible = regions[rName].value;
                var el = document.getElementById(rDef.domId);
                if (el) el.classList.toggle('region-hidden', !visible);
                trace('region ' + rName + ': ' + (visible ? 'SHOW' : 'HIDE'));

                if (!visible && rDef.fields) {
                    for (var i = 0; i < rDef.fields.length; i++) {
                        var errEl = document.getElementById('error_' + rDef.fields[i]);
                        if (errEl) errEl.textContent = '';
                    }
                }
            }));
        })(regionName, plan.regions[regionName]);
    }

    // ── Step 5: Rules ──
    for (var ri = 0; ri < plan.rules.length; ri++) {
        (function(rule) {
            var triggerField = fields[rule.trigger.field];
            var firstRun = true;

            disposers.push(effect(function() {
                var val = triggerField.value;
                if (firstRun) { firstRun = false; return; }
                if (val === null) return;

                trace('rule[' + rule.id + ']: ' + rule.trigger.field + ' → ' + JSON.stringify(val));

                for (var fi = 0; fi < rule.effects.length; fi++) {
                    var fx = rule.effects[fi];
                    switch (fx.type) {
                        case 'clearField':
                            fields[fx.target].value = null;
                            if (controls[fx.target]) {
                                controls[fx.target].value = null;
                                controls[fx.target].text = '';
                                controls[fx.target].dataBind();
                            }
                            trace('  clear: ' + fx.target);
                            break;

                        case 'disableField':
                            if (controls[fx.target]) controls[fx.target].enabled = false;
                            trace('  disable: ' + fx.target);
                            break;

                        case 'loadDataSource':
                            (function(lane, targetName) {
                                if (abortMap[lane]) {
                                    abortMap[lane].abort();
                                    trace('  abort previous: ' + lane);
                                }
                                var ctrl = new AbortController();
                                abortMap[lane] = ctrl;
                                var fid = untracked(function() { return triggerField.value; });
                                trace('  fetch: units for ' + fid);

                                setTimeout(function() {
                                    if (ctrl.signal.aborted) {
                                        trace('  ✗ stale: ' + fid);
                                        return;
                                    }
                                    var data = FAKE_UNITS[fid] || [];
                                    trace('  ✓ loaded: ' + data.length + ' units for ' + fid);
                                    controls[targetName].dataSource = data;
                                    controls[targetName].enabled = data.length > 0;
                                    controls[targetName].dataBind();
                                }, 400);
                            })(fx.lane, fx.target);
                            break;
                    }
                }
            }));
        })(plan.rules[ri]);
    }

    // ── Validate ──
    function validate() {
        var errors = [];
        for (var fieldName in plan.validation) {
            var rules = plan.validation[fieldName];
            var fieldErr = null;

            for (var i = 0; i < rules.length; i++) {
                var rule = rules[i];
                if (rule.when) {
                    var regionVisible = untracked(function() {
                        return regions[rule.when] ? regions[rule.when].value : false;
                    });
                    if (!regionVisible) {
                        trace('validate skip: ' + fieldName + ' (' + rule.when + ' hidden)');
                        continue;
                    }
                }
                var val = untracked(function() { return fields[fieldName].value; });
                if (rule.type === 'notEmpty' && (!val || val === '')) {
                    fieldErr = rule.message;
                    errors.push({ field: fieldName, message: rule.message });
                }
            }
            var errEl = document.getElementById('error_' + fieldName);
            if (errEl) errEl.textContent = fieldErr || '';
        }
        trace('validate: ' + (errors.length === 0 ? '✓ PASS' : '✗ ' + errors.map(function(e) { return e.field; }).join(', ')));
        return errors;
    }

    // ── Collect payload ──
    function collectPayload() {
        var payload = {};
        for (var fieldName in plan.fields) {
            var regionName = null;
            for (var rn in plan.regions) {
                var rd = plan.regions[rn];
                if (rd.fields && rd.fields.indexOf(fieldName) >= 0) { regionName = rn; break; }
            }
            if (regionName) {
                var visible = untracked(function() { return regions[regionName].value; });
                if (!visible) {
                    trace('collect skip: ' + fieldName + ' (hidden)');
                    continue;
                }
            }
            (function(fn) {
                payload[fn] = untracked(function() { return fields[fn].value; });
            })(fieldName);
        }
        trace('payload: ' + JSON.stringify(payload));
        return payload;
    }

    // ── Buttons ──
    document.getElementById('btnValidate').onclick = function() { trace('── VALIDATE ──'); validate(); };
    document.getElementById('btnCollect').onclick = function() {
        trace('── COLLECT ──');
        document.getElementById('payload-output').textContent = JSON.stringify(collectPayload(), null, 2);
    };

    trace('✓ Island "' + plan.islandId + '" mounted');
    return { fields: fields, controls: controls, regions: regions, validate: validate, collectPayload: collectPayload };
}

// ── Boot ──
document.addEventListener('DOMContentLoaded', function() {
    var plan = JSON.parse(document.getElementById('plan').textContent);
    window.__island = mountIsland(plan);
});
</script>

</body>
</html>
